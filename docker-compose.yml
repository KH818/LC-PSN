version: "3.9"

services:
  influxdb:
    image: influxdb:2.7
    container_name: doa_influxdb
    restart: always
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: doa-lab
      DOCKER_INFLUXDB_INIT_BUCKET: doa_results
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: doa-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2

volumes:
  influxdb_data: